security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_provider:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern: ^/api/admin
            stateless: false
            provider: admin_provider
            json_login:
                check_path: api_admin_login
                username_path: email
                password_path: password
                success_handler: App\Security\JsonAuthSuccessHandler
                failure_handler: App\Security\JsonAuthFailureHandler
            logout:
                path: api_admin_logout
                target: /admin/login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            lazy: true
            stateless: true
            provider: admin_provider

    access_control:
        - { path: ^/api/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/me, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
